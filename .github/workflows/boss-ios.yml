name: boss-ios

on:
  push:
    branches: [main]
    paths: ["boss-ios/**", "tests/fixtures/**", ".github/workflows/boss-ios.yml"]
  pull_request:
    paths: ["boss-ios/**", "tests/fixtures/**", ".github/workflows/boss-ios.yml"]

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: boss-ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Unit and UI tests
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)? \(' | sed 's/ ($//')
          xcodebuild -project Boss.xcodeproj -scheme Boss -destination "platform=iOS Simulator,name=$DEVICE" -resultBundlePath TestResults test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-ios-test-results
          path: boss-ios/TestResults.xcresult
