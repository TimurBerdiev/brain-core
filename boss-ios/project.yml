name: Boss
options:
  bundleIdPrefix: dev.braincore
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Boss:
    type: application
    platform: iOS
    sources: [Boss]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.braincore.boss
        PRODUCT_NAME: Boss
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Boss
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  BossTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BossTests]
    dependencies: [{target: Boss}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.braincore.boss.tests
  BossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BossUITests]
    dependencies: [{target: Boss}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.braincore.boss.uitests
        TEST_TARGET_NAME: Boss
schemes:
  Boss:
    build:
      targets: {Boss: all, BossTests: [test], BossUITests: [test]}
    test:
      targets: [BossTests, BossUITests]
